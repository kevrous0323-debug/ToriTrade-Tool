<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ToriTrade Tools</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .menu { width: 100%; max-width: 420px; }
    h1 { font-size: 1.6rem; color: #f0f6fc; text-align: center; margin-bottom: 6px; }
    .sub { text-align: center; color: #8b949e; font-size: 0.85rem; margin-bottom: 30px; }
    a.tool {
      display: flex;
      align-items: center;
      gap: 16px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 14px;
      text-decoration: none;
      color: #e6edf3;
      transition: border-color 0.15s;
    }
    a.tool:active { border-color: #58a6ff; background: #1c2330; }
    .icon { font-size: 2rem; }
    .tool-name { font-size: 1.05rem; font-weight: 700; color: #f0f6fc; }
    .tool-desc { font-size: 0.78rem; color: #8b949e; margin-top: 3px; }
    .footer { text-align: center; color: #6e7681; font-size: 0.72rem; margin-top: 26px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="menu">
    <h1>⚡ ToriTrade Tools</h1>
    <p class="sub">Stratégie Trendline — outils de terrain</p>

    <a class="tool" href="calculatrice.html">
      <span class="icon">🧮</span>
      <span>
        <div class="tool-name">Calculatrice Position</div>
        <div class="tool-desc">Capital × Risque% ÷ SL% — sizing en 10 secondes</div>
      </span>
    </a>

    <a class="tool" href="checklist.html">
      <span class="icon">📋</span>
      <span>
        <div class="tool-name">Checklist Avant Entrée</div>
        <div class="tool-desc">28 points de validation — Weekly → 15min</div>
      </span>
    </a>

    <div class="footer">
      Le size n'est jamais arbitraire.<br>
      0 trade est une position valide.
    </div>
  </div>
</body>
</html>
